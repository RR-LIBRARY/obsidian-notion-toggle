name: Package Obsidian plugin release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach assets to (defaults to manifest version)"
        required: false
        default: ""
  release:
    types: [published, created, edited]
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  upload-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version manifest.json)"
          TAG=""
          if [ -n "${INPUT_TAG:-}" ]; then TAG="$INPUT_TAG"
          elif [ -n "${EVENT_TAG:-}" ]; then TAG="$EVENT_TAG"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then TAG="${GITHUB_REF_NAME}"
          else
            if gh release view "$VERSION" >/dev/null 2>&1; then TAG="$VERSION"; else TAG="v$VERSION"; fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Obsidian plugin release $TAG"

      - name: Upload BRAT release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" manifest.json main.js styles.css --clobber
