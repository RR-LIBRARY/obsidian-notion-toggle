name: Package Obsidian plugin release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upload-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload BRAT release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_NAME="v$(jq -r .version manifest.json)"
          for file in manifest.json main.js styles.css; do
            gh release upload "$TAG_NAME" "$file" --clobber
          done
