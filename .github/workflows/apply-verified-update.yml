name: Apply verified plugin update
on:
  workflow_dispatch:
    inputs:
      branch:
        required: true
        type: string
      patch_source:
        required: true
        type: string
      patch_release:
        required: true
        type: string
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Apply the reviewed source and release patches
        env:
          BRANCH: ${{ inputs.branch }}
          PATCH_SOURCE: ${{ inputs.patch_source }}
          PATCH_RELEASE: ${{ inputs.patch_release }}
        run: |
          set -euo pipefail
          git checkout -b "$BRANCH"
          printf '%s' "$PATCH_SOURCE" | base64 -d | gzip -d > /tmp/source.patch
          printf '%s' "$PATCH_RELEASE" | base64 -d | gzip -d > /tmp/release.patch
          git apply --check /tmp/source.patch
          git apply --check /tmp/release.patch
          git apply /tmp/source.patch
          git apply /tmp/release.patch
          git rm .github/workflows/apply-verified-update.yml
      - run: bun install
      - run: bun test
      - run: bun run build
      - run: cp dist/main.js main.js
      - name: Commit and publish the update branch
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Notion and callout appearance switching"
          git push -u origin "$BRANCH"
