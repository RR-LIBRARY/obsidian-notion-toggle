name: Release on tag push

# Pushing a version tag (e.g. 1.8.19) creates the GitHub release and attaches
# the BRAT files in one go. A release created by the workflow token does not
# trigger other workflows, so the assets are uploaded here too.
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

concurrency:
  group: release-on-tag-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          set -euo pipefail
          VERSION="$(jq -r .version manifest.json)"
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest.json version $VERSION" >&2
            exit 1
          fi

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            NOTES="$(awk -v t="$TAG" '$0 ~ "^## \\[?"t {f=1; next} f && /^## / {exit} f' CHANGELOG.md || true)"
            gh release create "$TAG" --title "$TAG" --notes "${NOTES:-Obsidian plugin release $TAG}"
          fi

      - name: Upload BRAT release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" manifest.json main.js styles.css --clobber
