<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="styles.css"><style>
body{font:16px/1.5 system-ui;margin:0;padding:20px;box-sizing:border-box;--text-normal:#24262a;--text-muted:#63666d;--background-primary:#fff;--background-secondary:#f5f5f5;--background-modifier-border-hover:#ccc;--size-4-3:12px;--size-4-6:24px;--size-4-4:16px;--size-4-2:8px;--radius-s:4px;--icon-l:20px;--callout-color:70,120,160;--color-red-rgb:212,52,59;--color-yellow-rgb:188,148,20;--color-green-rgb:40,148,92}button,select,input{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}#actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.callout-title{display:flex;gap:8px;align-items:center}.callout-title-inner{flex:1}.is-collapsed>.callout-content{display:none}.callout{--callout-color:65,125,190}.callout[data-callout=recall-red]{--callout-color:212,52,59}.callout[data-callout=recall-yellow]{--callout-color:188,148,20}.callout[data-callout=recall-green]{--callout-color:40,148,92}
